; ImeCursor settings (UTF-8). Lines starting with ; or # are comments.
; After editing: tray menu > Reload settings (or restart ImeCursor).
; Invalid values are ignored (the default is used); out-of-range numbers are clamped
; to the allowed range. Both are reported in ImeCursor.log.

[General]
; 1 = badge shows the input method name too ("微信 中"), 0 = only the mode ("中")
ShowImeName=1
; How often the input mode is queried, in milliseconds (20..2000)
PollMs=80
; How often the badge follows the pointer, in milliseconds (5..200)
FollowMs=15
; Badge opacity 30..255
Opacity=235
FontName=Microsoft YaHei UI
; Font size in points at 100% scaling (scaled by the DPI of the monitor under the pointer)
FontSize=9.5
; Where the badge sits: caret = bottom-right of the text cursor, mouse = bottom-right of the mouse pointer
Anchor=caret
; With Anchor=caret, when no text cursor can be found (desktop, no text field focused):
; mouse = show the badge at the mouse pointer instead, hide = hide the badge
NoCaret=mouse
; How often the text cursor position is read, in milliseconds (15..500); caret movement also wakes it
CaretMs=50
; Badge offset in logical pixels, or auto. Caret: from the text cursor's bottom-right corner
; (auto = 2 px). Mouse: from the pointer hotspot (auto = 0.36 x / 0.50 x the pointer size,
; so the badge sits just below-right of the arrow)
OffsetX=auto
OffsetY=auto
; Hide the badge while a full-screen app (game, video, F11 browser) is in front
HideInFullscreen=1
; Hide the badge while the mouse pointer itself is hidden
HideWhenCursorHidden=0
; Briefly enlarge the badge when the mode changes
FlashOnChange=1
FlashMs=700
FlashScale=1.4
; Tray icon shows the current mode (中/英/A/EN) in the state colour
TrayShowsState=1

[Colors]
; #RRGGBB
Chinese=#E5484D
English=#2F80ED
Keyboard=#6B7280
Caps=#D97706
Unknown=#6B7280
Text=#FFFFFF

[Text]
; Mode glyphs. Native.<lang> overrides the native glyph for one language.
Native=中
Alpha=英
Caps=A
Unknown=?
Native.0411=あ
Native.0412=한

[Rules]
; How Chinese/English mode is decided, per language (hex LANGID):
;   auto      = 'open' if the language's input method is WeType, else 'open+conv'
;   open      = Chinese when the IME is open (WeType)
;   open+conv = Chinese when open AND the conversion mode is native (Microsoft Pinyin, most IMEs)
;   conv      = Chinese when the conversion mode is native
;   keyboard  = treat as a plain keyboard layout (no mode)
; Other languages are plain keyboard layouts. To turn one of the IME languages below into a
; plain keyboard, set it to keyboard (deleting its line keeps auto).
0804=auto
0404=auto
0C04=auto
1004=auto
1404=auto
0411=auto
0412=auto

[Labels]
; Short input-method name shown before the mode, per language (hex LANGID).
; auto = from the enabled input method: WeType -> 微信, Microsoft Pinyin -> 微软,
;        Sogou -> 搜狗, QQ -> QQ, Baidu -> 百度; several enabled for one language -> 中文.
; Keyboard layouts default to the language code (0409 -> EN).
0804=auto
;0409=EN
